# Gera github-metrics.svg com as linguagens mais usadas.
# Antes de rodar, crie um token em https://github.com/settings/tokens
# e salve como secret METRICS_TOKEN em Settings > Secrets and variables > Actions.
# Para rodar: aba Actions > Metrics > Run workflow.
name: Metrics
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: laric4
          template: classic
          base: header, repositories
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          filename: github-metrics.svg
